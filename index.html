<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hextris 多人对战</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- 主菜单 -->
        <div id="mainMenu" class="screen active">
            <div class="logo">HEXTRIS</div>
            <div class="subtitle">多人对战版</div>
            <div class="button-group">
                <button class="btn btn-primary" id="singlePlayerBtn">单人游戏</button>
                <button class="btn btn-secondary" id="multiplayerBtn">多人对战</button>
                <button class="btn btn-tertiary" id="settingsBtn">设置</button>
            </div>
        </div>

        <!-- 房间大厅 -->
        <div id="lobbyScreen" class="screen">
            <div class="header">
                <h1>房间大厅</h1>
                <button class="btn-back" id="backToMenuFromLobby">← 返回主菜单</button>
            </div>
            <div class="room-actions">
                <button class="btn btn-primary" id="createRoomBtn">创建房间</button>
                <div class="input-group">
                    <input type="text" id="joinRoomInput" placeholder="输入6位房间号" maxlength="6" />
                    <button class="btn btn-secondary" id="joinRoomBtn">加入房间</button>
                </div>
            </div>
            <div class="room-list">
                <h3>当前在线房间</h3>
                <div id="roomList" class="rooms">
                    <!-- 房间列表将动态生成 -->
                </div>
            </div>
        </div>

        <!-- 房间内界面 -->
        <div id="roomScreen" class="screen">
            <div class="header">
                <h1 id="roomId">房间号: --</h1>
                <button class="btn-back" id="leaveRoomBtn">离开房间</button>
            </div>
            <div class="players-section">
                <h3>玩家列表</h3>
                <div id="playerList" class="players">
                    <!-- 玩家列表将动态生成 -->
                </div>
            </div>
            <div class="game-status">
                <div id="roomStatus" class="status">等待其他玩家...</div>
                <button class="btn btn-primary btn-large" id="startGameBtn" disabled>开始游戏</button>
            </div>
        </div>

        <!-- 游戏界面 -->
        <div id="gameScreen" class="screen">
            <div class="game-header">
                <h1>游戏中</h1>
                <button class="btn btn-danger" id="quitGameBtn">退出游戏</button>
            </div>
            <div id="gameContainer" class="game-container">
                <!-- 玩家游戏区域将动态生成 -->
            </div>
        </div>

        <!-- 游戏结束界面 -->
        <div id="gameOverScreen" class="screen">
            <div class="header">
                <h1>游戏结束</h1>
                <button class="btn-back" id="backToMenuFromOver">返回主菜单</button>
            </div>
            <div class="results">
                <h2>最终排名</h2>
                <div id="rankingList" class="ranking">
                    <!-- 排名将动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <!-- 多人游戏管理器 -->
    <script src="js/multiplayer-game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/singleplayer-help.js"></script>
    <!-- 原游戏核心文件 -->
    <script src="vendor/jsonfn.min.js"></script>
    <script src="vendor/js.cookie.js"></script>
    <script src="js/Hex.js"></script>
    <script src="js/Text.js"></script>
    <script src="js/wavegen.js"></script>
    <script src="js/render.js"></script>
    <script src="js/Block.js"></script>
    <script src="js/save-state.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>
    <script src="js/checking.js"></script>
    <script src="js/update.js"></script>
    <script src="js/initialization.js"></script>
    <script src="js/view.js"></script>
    <script src="js/math.js"></script>
    <script src="js/comboTimer.js"></script>
</body>
</html>
